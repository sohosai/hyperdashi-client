services:
  server:
    build:
      context: ../hyperdashi-server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${SERVER_GIT_SHA:-unknown}
    environment:
      DATABASE_URL: sqlite:///app/data/hyperdashi.db
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: /app/uploads
      RUST_LOG: hyperdashi_server=debug,tower_http=debug,sqlx=warn
    ports:
      - "8080:8080"
    volumes:
      - server-data:/app/data
      - server-uploads:/app/uploads
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8080/api/v1
        VITE_GIT_SHA: ${CLIENT_GIT_SHA:-unknown}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  server-data:
  server-uploads:
